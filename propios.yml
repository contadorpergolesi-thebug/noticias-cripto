name: Contenido propio (blog y YouTube)

on:
  schedule:
    - cron: "*/20 * * * *"   # cada 20 minutos: avisa apenas publicas algo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contenido-propio
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser requests

      - name: Publicar contenido propio
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLO_PROPIOS: "1"
        run: python bot.py

      - name: Guardar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet && exit 0
          git commit -m "actualizar historial [skip ci]"
          # Reintentos: si el otro workflow guardo justo antes, volvemos a probar.
          for intento in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Reintento $intento..."
            sleep 5
          done
          echo "No se pudo guardar el historial despues de 5 intentos."
          exit 1
