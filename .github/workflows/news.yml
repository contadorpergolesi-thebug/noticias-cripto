name: Noticias cripto a Telegram

on:
  schedule:
    - cron: "17 12,14,16,18,20,22,0,2 * * *"   # cada 2 horas UTC = 9,11,13,15,17,19,21,23 en Argentina
  workflow_dispatch:          # boton para lanzarlo a mano

permissions:
  contents: write             # necesario para guardar seen.json

concurrency:
  group: noticias-generales
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser requests

      - name: Publicar noticias
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Guardar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet && exit 0
          git commit -m "actualizar historial [skip ci]"
          # Reintentos: si el otro workflow guardo justo antes, volvemos a probar.
          for intento in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Reintento $intento..."
            sleep 5
          done
          echo "No se pudo guardar el historial despues de 5 intentos."
          exit 1
